# The Linux x86_64 release: ONE executable file, `auto-crop-linux-x86_64` (decision B22), built on
# `ubuntu-22.04` (glibc 2.35, the oldest supported). It is the desktop app (no arguments), the
# command-line tool (any arguments) and the sandboxed decode worker (`--decode-worker`, started by
# the app itself), with libheif, dav1d and libde265 LINKED IN (AVIF, HEIC and HEIF input). Only the
# system's own libraries (glibc, WebKitGTK and GTK for the window) stay dynamic. The pinned native
# libraries are built as static archives here (`cargo xtask build-native --static`). The result is
# uploaded as a workflow artifact (14 days). Nothing is published: no release, no tag.
#
# The file is proven by running it ALONE (packaging/smoke-single.sh): it is copied into an empty
# folder, the build tree is moved away and LD_LIBRARY_PATH is cleared, then its command-line mode
# decodes a committed AVIF and the HEIC of the pinned libheif archive through the sandboxed worker
# (the same file). The app is started under Xvfb for ten seconds (informational: the window is not
# driven by a test, a window list and a screenshot are kept).
name: Package Linux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ubuntu-22.04 x86_64, single executable with heif
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools (NASM, Meson, Ninja), WebKitGTK and GTK headers, and the smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm meson ninja-build pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            xvfb xauth x11-utils imagemagick dbus libgl1-mesa-dri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install cargo-about
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      - name: Toolchain report
        run: |
          rustc --version && cargo --version && node --version && npm --version && cmake --version | head -1
          meson --version; ninja --version; nasm --version
          ldd --version | head -1; pkg-config --modversion webkit2gtk-4.1 gtk+-3.0
      - name: Build the pinned libheif, dav1d and libde265 as static archives
        run: cargo xtask build-native --static
      - name: Static archives (what the linker will take)
        run: ls -l target/native/prefix-static/lib
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
          test -f dist/index.html
      - name: Build the executable (release, libraries linked in)
        env:
          AUTOCROP_NATIVE_PREFIX: ${{ github.workspace }}/target/native/prefix-static
          AUTOCROP_HEIF_STATIC: "1"
        run: |
          cargo build --release -p auto-crop-shell --features "gui,custom-protocol,heif"
          ls -l target/release/AutoCrop
          file target/release/AutoCrop
          echo "--- what the executable loads at start (system libraries only)"
          ldd target/release/AutoCrop | awk '{print $1}' | sort
      - name: Check the executable (no encoder symbols, no decoder library imported)
        run: cargo xtask check-native --binary target/release/AutoCrop
      - name: Third-party notices (cargo about)
        run: |
          # The shell tree first (Tauri and wry are not in the default workspace build); the default
          # tree is the fallback so the notices file always exists.
          if cargo about generate about.hbs --manifest-path crates/shell/Cargo.toml --features gui,heif -o THIRD_PARTY_NOTICES.md; then
            echo "notices: shell tree"
          else
            echo "::warning::cargo about failed for the shell tree; using the default workspace tree"
            cargo about generate about.hbs -o THIRD_PARTY_NOTICES.md
          fi
          test -s THIRD_PARTY_NOTICES.md
      - name: Assemble the release files
        id: pkg
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "workspace version not found"; exit 1; }
          dist="$GITHUB_WORKSPACE/dist"
          rm -rf "$dist"; mkdir -p "$dist"
          install -m 755 target/release/AutoCrop "$dist/auto-crop-linux-x86_64"
          cp THIRD_PARTY_NOTICES.md "$dist/"
          if grep -a -q -e AUTOCROP_ESCAPE -e AUTOCROP-FAULT: "$dist/auto-crop-linux-x86_64"; then echo "the executable contains test hooks"; exit 1; fi
          (cd "$dist" && sha256sum auto-crop-linux-x86_64 | tee "SHA256SUMS-linux-x86_64-$ver.txt")
          size=$(stat -c %s "$dist/auto-crop-linux-x86_64"); echo "size: $size bytes"
          [ "$size" -gt 3000000 ] && [ "$size" -lt 250000000 ] || { echo "implausible size"; exit 1; }
          {
            echo "ver=$ver"
            echo "exe=$dist/auto-crop-linux-x86_64"
          } >> "$GITHUB_OUTPUT"
          ls -l "$dist"
      - name: Fixtures for the smoke test (a committed AVIF and the HEIC of the pinned libheif archive)
        run: |
          set -euo pipefail
          fx="$RUNNER_TEMP/fixtures"; mkdir -p "$fx"
          cp crates/codecs/tests/fixtures/heif/gradient-444-48x32.avif "$fx/"
          heic=$(find target/native -name rainbow-451x461.heic -type f | head -1)
          [ -n "$heic" ] || { echo "rainbow-451x461.heic not found in the libheif archive"; exit 1; }
          cp "$heic" "$fx/"
          ls -l "$fx"
      - name: Smoke test of the executable ALONE (empty folder, no build tree, no LD_LIBRARY_PATH)
        env:
          EXE: ${{ steps.pkg.outputs.exe }}
        run: |
          set -euo pipefail
          # Nothing may resolve from the build tree.
          mv "$GITHUB_WORKSPACE/target/native/prefix-static" "$GITHUB_WORKSPACE/target/native/prefix-static.moved-away"
          trap 'mv "$GITHUB_WORKSPACE/target/native/prefix-static.moved-away" "$GITHUB_WORKSPACE/target/native/prefix-static"' EXIT
          unset LIBHEIF_PLUGIN_PATH AUTOCROP_NATIVE_PREFIX LD_LIBRARY_PATH
          summary=$(bash "$GITHUB_WORKSPACE/packaging/smoke-single.sh" "$EXE" \
            "$RUNNER_TEMP/fixtures/gradient-444-48x32.avif" "$RUNNER_TEMP/fixtures/rainbow-451x461.heic" "$RUNNER_TEMP/smoke-out")
          echo "$summary"
          {
            echo "### Linux x86_64 single-file smoke test (headless CLI mode of the executable)"
            echo
            echo "$summary"
            echo "* build tree moved away; LIBHEIF_PLUGIN_PATH and LD_LIBRARY_PATH cleared"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The app starts under Xvfb and stays alive (informational; the window is not driven)
        continue-on-error: true
        env:
          EXE: ${{ steps.pkg.outputs.exe }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/gui-out"; mkdir -p "$out"
          export APP="$EXE" OUT="$out"
          export AUTO_CROP_HOME="$RUNNER_TEMP/gui-home" NO_AT_BRIDGE=1 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
          unset LIBHEIF_PLUGIN_PATH AUTOCROP_NATIVE_PREFIX LD_LIBRARY_PATH
          cat > "$RUNNER_TEMP/gui.sh" <<'GUI'
          #!/usr/bin/env bash
          "$APP" > "$OUT/app.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; echo "the app exited with code $? within 10 seconds"; cat "$OUT/app.log"; exit 1
          fi
          echo "the app is running after 10 seconds (pid $pid)"
          xwininfo -root -tree > "$OUT/windows.txt" 2>&1 || true
          grep -i "auto crop" "$OUT/windows.txt" || echo "no window titled Auto Crop in the X tree"
          import -window root "$OUT/screenshot.png" || echo "import failed"
          ls -l "$OUT/screenshot.png" || true
          kill "$pid"; sleep 1; kill -9 "$pid" 2>/dev/null || true
          GUI
          chmod +x "$RUNNER_TEMP/gui.sh"
          if command -v dbus-run-session >/dev/null; then
            dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" "$RUNNER_TEMP/gui.sh"
          else
            xvfb-run -a -s "-screen 0 1440x900x24" "$RUNNER_TEMP/gui.sh"
          fi
          status=$?
          cat "$out/app.log" || true
          exit $status
      - name: Upload the executable, its notices and checksum (14 days; nothing is published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-crop-linux-x86_64-${{ steps.pkg.outputs.ver }}
          path: |
            dist/auto-crop-linux-x86_64
            dist/THIRD_PARTY_NOTICES.md
            dist/SHA256SUMS-linux-x86_64-${{ steps.pkg.outputs.ver }}.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload the start-up log, window list and screenshot (informational)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-check-linux-x86_64
          path: ${{ runner.temp }}/gui-out
          retention-days: 14
          if-no-files-found: warn
