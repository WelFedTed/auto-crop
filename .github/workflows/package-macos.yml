# FROZEN (decision B23): macOS is not released while the app is finished on Windows; this workflow is kept
# working but is only run by hand.

# The macOS release: ONE executable file per architecture, `auto-crop-macos-arm64` (Apple silicon,
# `macos-latest`) and, best-effort, `auto-crop-macos-x86_64` (Intel, `macos-26-intel`) (decision
# B22). The file is the desktop app (no arguments), the command-line tool (any arguments) and the
# sandboxed decode worker (`--decode-worker`, started by the app itself), with libheif, dav1d and
# libde265 LINKED IN (AVIF, HEIC and HEIF input). The pinned native libraries are built as static
# archives here (`cargo xtask build-native --static`). The file is ad-hoc signed by the linker and
# NOT notarised (decision B15, no Apple account). It is a bare executable, not an app bundle. Each
# is uploaded as a workflow artifact (14 days). Nothing is published: no release, no tag.
#
# The file is proven by running it ALONE (packaging/smoke-single.sh): copied into an empty folder,
# the build tree moved away and the library search variables cleared, its command-line mode decodes
# a committed AVIF and the HEIC of the pinned libheif archive through the sandboxed worker (the same
# file). The app is started for ten seconds and a screenshot is taken (informational: the window is
# not driven).
name: Package macOS

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Which build: all, arm64 (Apple silicon) or x86_64 (Intel, best-effort)"
        type: choice
        options: [all, arm64, x86_64]
        default: all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The product floor (macOS 12); rustc, CMake, meson and cc all read this variable.
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  plan:
    name: choose the builds
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          # Intel needs NASM (dav1d assembly); the arm64 build does not.
          all='[
            {"os":"macos-latest","arch":"arm64","best-effort":false,"brew":"meson ninja"},
            {"os":"macos-26-intel","arch":"x86_64","best-effort":true,"brew":"meson ninja nasm"}
          ]'
          matrix=$(jq -c --arg a "${ARCH:-all}" '{include: [.[] | select($a == "all" or .arch == $a)]}' <<<"$all")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  package:
    name: ${{ matrix.os }} ${{ matrix.arch }}, single executable with heif${{ matrix.best-effort && ' (best-effort)' || '' }}
    needs: plan
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.best-effort }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Meson, Ninja (and NASM on Intel); they build dav1d
        env:
          BREW_PACKAGES: ${{ matrix.brew }}
        run: |
          # shellcheck disable=SC2086
          brew install $BREW_PACKAGES
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install cargo-about
        if: matrix.arch == 'arm64'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about
      - name: Install cargo-about from source (no prebuilt binary for Intel macOS)
        if: matrix.arch == 'x86_64'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Toolchain report
        run: |
          uname -m; sw_vers
          rustc --version && cargo --version && node --version && npm --version && cmake --version | head -1
          meson --version; ninja --version; nasm --version || true
          xcode-select -p
      - name: Build the pinned libheif, dav1d and libde265 as static archives
        run: cargo xtask build-native --static
      - name: Static archives (what the linker will take)
        run: ls -l target/native/prefix-static/lib
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
          test -f dist/index.html
      - name: Build the executable (release, libraries linked in)
        env:
          AUTOCROP_NATIVE_PREFIX: ${{ github.workspace }}/target/native/prefix-static
          AUTOCROP_HEIF_STATIC: "1"
        run: |
          cargo build --release -p auto-crop-shell --features "gui,custom-protocol,heif"
          ls -l target/release/AutoCrop
          file target/release/AutoCrop
          lipo -archs target/release/AutoCrop
          otool -l target/release/AutoCrop | awk '/LC_BUILD_VERSION/ {b=1} b && /minos/ {print "minos " $2; b=0}'
          echo "--- what the executable loads at start (system libraries and frameworks only)"
          otool -L target/release/AutoCrop
      - name: Check the executable (no encoder symbols, no decoder library imported)
        run: cargo xtask check-native --binary target/release/AutoCrop
      - name: Third-party notices (cargo about)
        run: |
          # The shell tree first (Tauri and wry are not in the default workspace build); the default
          # tree is the fallback so the notices file always exists.
          if cargo about generate about.hbs --manifest-path crates/shell/Cargo.toml --features gui,heif -o THIRD_PARTY_NOTICES.md; then
            echo "notices: shell tree"
          else
            echo "::warning::cargo about failed for the shell tree; using the default workspace tree"
            cargo about generate about.hbs -o THIRD_PARTY_NOTICES.md
          fi
          test -s THIRD_PARTY_NOTICES.md
      - name: Assemble the release files
        id: pkg
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "workspace version not found"; exit 1; }
          name="auto-crop-macos-$ARCH"
          dist="$GITHUB_WORKSPACE/dist"
          rm -rf "$dist"; mkdir -p "$dist"
          install -m 755 target/release/AutoCrop "$dist/$name"
          cp THIRD_PARTY_NOTICES.md "$dist/THIRD_PARTY_NOTICES.md"
          if grep -a -q -e AUTOCROP_ESCAPE -e AUTOCROP-FAULT: "$dist/$name"; then echo "the executable contains test hooks"; exit 1; fi
          # Apple silicon links an ad-hoc signature itself; Intel does not: sign (free, ad hoc) either way.
          codesign --force --sign - "$dist/$name"
          codesign --verify --verbose=2 "$dist/$name"
          (cd "$dist" && shasum -a 256 "$name" | tee "SHA256SUMS-macos-$ARCH-$ver.txt")
          size=$(stat -f %z "$dist/$name"); echo "size: $size bytes"
          [ "$size" -gt 3000000 ] && [ "$size" -lt 250000000 ] || { echo "implausible size"; exit 1; }
          {
            echo "name=$name"
            echo "ver=$ver"
            echo "exe=$dist/$name"
          } >> "$GITHUB_OUTPUT"
          ls -l "$dist"
      - name: Fixtures for the smoke test (a committed AVIF and the HEIC of the pinned libheif archive)
        run: |
          set -euo pipefail
          fx="$RUNNER_TEMP/fixtures"; mkdir -p "$fx"
          cp crates/codecs/tests/fixtures/heif/gradient-444-48x32.avif "$fx/"
          heic=$(find target/native -name rainbow-451x461.heic -type f | head -1)
          [ -n "$heic" ] || { echo "rainbow-451x461.heic not found in the libheif archive"; exit 1; }
          cp "$heic" "$fx/"
          ls -l "$fx"
      - name: Smoke test of the executable ALONE (empty folder, no build tree, no library search variables)
        env:
          EXE: ${{ steps.pkg.outputs.exe }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Nothing may resolve from the build tree.
          mv "$GITHUB_WORKSPACE/target/native/prefix-static" "$GITHUB_WORKSPACE/target/native/prefix-static.moved-away"
          trap 'mv "$GITHUB_WORKSPACE/target/native/prefix-static.moved-away" "$GITHUB_WORKSPACE/target/native/prefix-static"' EXIT
          unset LIBHEIF_PLUGIN_PATH AUTOCROP_NATIVE_PREFIX DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FRAMEWORK_PATH LD_LIBRARY_PATH
          summary=$(bash "$GITHUB_WORKSPACE/packaging/smoke-single.sh" "$EXE" \
            "$RUNNER_TEMP/fixtures/gradient-444-48x32.avif" "$RUNNER_TEMP/fixtures/rainbow-451x461.heic" "$RUNNER_TEMP/smoke-out")
          echo "$summary"
          {
            echo "### macOS $ARCH single-file smoke test (headless CLI mode of the executable)"
            echo
            echo "$summary"
            echo "* ad-hoc signature verified with \`codesign --verify\`"
            echo "* build tree moved away; LIBHEIF_PLUGIN_PATH and the DYLD variables cleared"
            echo "* the desktop window was not driven by a test"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The app starts from the lone executable and stays alive (informational; the window is not driven)
        continue-on-error: true
        env:
          EXE: ${{ steps.pkg.outputs.exe }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/gui-out"
          unset LIBHEIF_PLUGIN_PATH AUTOCROP_NATIVE_PREFIX DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          export AUTO_CROP_HOME="$RUNNER_TEMP/gui-home"
          "$EXE" > "$RUNNER_TEMP/gui-out/app.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; code=$?
            echo "the app exited with code $code within 10 seconds"; cat "$RUNNER_TEMP/gui-out/app.log" || true
            exit 1
          fi
          echo "the app is running after 10 seconds (pid $pid)"
          # A screenshot works only when the runner has a logged-in desktop session and has granted
          # screen recording; say honestly when it did not.
          if screencapture -x "$RUNNER_TEMP/gui-out/window.png"; then
            ls -l "$RUNNER_TEMP/gui-out/window.png"
          else
            echo "::warning::screencapture failed on this runner"
          fi
          ps -o pid,rss,command -p "$pid"
          kill "$pid"; sleep 1; kill -9 "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/gui-out/app.log" || true
      - name: Upload the executable, its notices and checksum (14 days; nothing is published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-crop-macos-${{ matrix.arch }}-${{ steps.pkg.outputs.ver }}
          path: |
            dist/${{ steps.pkg.outputs.name }}
            dist/THIRD_PARTY_NOTICES.md
            dist/SHA256SUMS-macos-${{ matrix.arch }}-${{ steps.pkg.outputs.ver }}.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload the start-up log and screenshot (informational)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-check-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/gui-out
          retention-days: 14
          if-no-files-found: warn
