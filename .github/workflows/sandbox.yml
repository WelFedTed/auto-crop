# Sandbox proof of concept (ROADMAP M0.21-M0.23): runs the spike on each OS and records the
# level reached (see docs/adr). The spike is throwaway code under spikes/sandbox.
name: Sandbox spike

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "spikes/sandbox/**"
      - ".github/workflows/sandbox.yml"

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }}${{ matrix.best-effort && ' (best-effort)' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, best-effort: false }
          - { os: ubuntu-24.04, best-effort: true }
          - { os: ubuntu-22.04-arm, best-effort: true }
          - { os: macos-latest, best-effort: false }
          - { os: windows-2025, best-effort: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kernel / OS
        shell: bash
        run: uname -a; cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || true; (cat /sys/kernel/security/lsm 2>/dev/null || true); echo
      - name: Run the sandbox probe
        shell: bash
        run: cargo run --manifest-path spikes/sandbox/Cargo.toml -- spikes/sandbox/Cargo.toml
      - name: Run the probe with Landlock disabled (the fallback must be recorded, never silent)
        if: runner.os == 'Linux'
        shell: bash
        env:
          AUTOCROP_SANDBOX_NO_LANDLOCK: "1"
        run: |
          out=$(cargo run --manifest-path spikes/sandbox/Cargo.toml -- spikes/sandbox/Cargo.toml | tee /dev/stderr)
          echo "$out" | grep -q 'landlock=unavailable(disabled by AUTOCROP_SANDBOX_NO_LANDLOCK)'

  fedora:
    name: fedora (best-effort)
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:latest on 2026-10-01
    steps:
      - name: Toolchain
        run: dnf install -y --setopt=install_weak_deps=False rust cargo gcc git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the sandbox probe
        run: cargo run --manifest-path spikes/sandbox/Cargo.toml -- spikes/sandbox/Cargo.toml
