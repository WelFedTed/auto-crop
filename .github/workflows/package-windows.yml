# The Windows x64 release: ONE stand-alone file, `auto-crop.exe` (decision B22). It is the desktop
# app (no arguments), the command-line tool (any arguments) and the sandboxed decode worker
# (`--decode-worker`, started by the app itself), with libheif, dav1d and libde265 LINKED IN (AVIF,
# HEIC and HEIF input). The pinned native libraries are built as static archives here
# (`cargo xtask build-native --static`: the owner's machine has no cmake, ninja, meson or nasm), then
# the app. The result is uploaded as a workflow artifact (14 days). Nothing is published: no
# release, no tag.
#
# The file is proven by running it ALONE: it is copied into an empty folder, the build tree is moved
# away and PATH is reduced to System32, then its command-line mode decodes a committed AVIF and the
# HEIC of the pinned libheif archive, forced through the sandboxed worker (the same exe), and doctor
# reports the sandbox level the worker itself reached. The GUI window is not driven by a test.
name: Package Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: windows-2025 x64, single exe with heif
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NASM
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
          $dir = "C:\Program Files\NASM"
          if (Test-Path $dir) { $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
      - name: Install Meson and Ninja (they build dav1d)
        shell: pwsh
        run: python -m pip install --quiet meson ninja
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install cargo-about
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      - name: Toolchain report
        shell: bash
        run: |
          rustc --version && cargo --version && node --version && npm --version && cmake --version | head -1
          meson --version; ninja --version; nasm --version || true
      - name: Build the pinned libheif, dav1d and libde265 as static archives
        run: cargo xtask build-native --static
      - name: Static archives (what the linker will take)
        shell: pwsh
        run: Get-ChildItem target\native\prefix-static\lib -Recurse | Select-Object FullName, Length
      - name: Build the UI
        shell: bash
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
          test -f dist/index.html
      - name: Build auto-crop.exe (release, libraries linked in)
        shell: pwsh
        env:
          AUTOCROP_NATIVE_PREFIX: ${{ github.workspace }}\target\native\prefix-static
          AUTOCROP_HEIF_STATIC: "1"
        run: |
          cargo build --release -p auto-crop-shell --features "gui,custom-protocol,heif"
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $p = 'target\release\AutoCrop.exe'
          if (-not (Test-Path $p)) { throw "$p was not built" }
          Get-Item $p | Select-Object Name, Length
      - name: Check the executable (no encoder symbols, no decoder DLL imported)
        run: cargo xtask check-native --binary target/release/AutoCrop.exe
      - name: Third-party notices (cargo about)
        shell: bash
        run: |
          # The shell tree first (Tauri and wry are not in the default workspace build); the default
          # tree is the fallback so the notices file always exists.
          if cargo about generate about.hbs --manifest-path crates/shell/Cargo.toml --features gui,heif -o THIRD_PARTY_NOTICES.md; then
            echo "notices: shell tree"
          else
            echo "::warning::cargo about failed for the shell tree; using the default workspace tree"
            cargo about generate about.hbs -o THIRD_PARTY_NOTICES.md
          fi
          test -s THIRD_PARTY_NOTICES.md
      - name: Assemble the release files
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $ver) { throw "workspace version not found" }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Join-Path $dist 'auto-crop.exe'
          Copy-Item 'target\release\AutoCrop.exe' -Destination $exe
          # A shipped build has none of the test-only escape hooks.
          $bytes = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($exe))
          foreach ($s in 'AUTOCROP_ESCAPE', 'AUTOCROP-FAULT:') { if ($bytes.Contains($s)) { throw "the executable contains $s" } }
          Copy-Item THIRD_PARTY_NOTICES.md -Destination (Join-Path $dist 'THIRD_PARTY_NOTICES.md')
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # LF line ends (sha256sum -c rejects a CRLF file): no Set-Content.
          [System.IO.File]::WriteAllText((Join-Path $dist "SHA256SUMS-windows-x64-$ver.txt"), "$hash  auto-crop.exe`n")
          Get-ChildItem $dist | Select-Object Name, Length
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Fixtures for the smoke test (a committed AVIF and the HEIC of the pinned libheif archive)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fx = Join-Path $env:RUNNER_TEMP 'fixtures'
          New-Item -ItemType Directory -Force -Path $fx | Out-Null
          Copy-Item 'crates\codecs\tests\fixtures\heif\gradient-444-48x32.avif' -Destination $fx
          $heic = Get-ChildItem -Path 'target\native' -Recurse -Filter 'rainbow-451x461.heic' -File | Select-Object -First 1
          if (-not $heic) { throw "rainbow-451x461.heic not found in the libheif archive" }
          Copy-Item $heic.FullName -Destination $fx
          Get-ChildItem $fx
      - name: Smoke test of auto-crop.exe ALONE (empty folder, no build tree, PATH reduced to System32)
        shell: pwsh
        env:
          EXE: ${{ steps.pkg.outputs.exe }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $alone = Join-Path $env:RUNNER_TEMP 'alone'
          if (Test-Path $alone) { Remove-Item -Recurse -Force $alone }
          New-Item -ItemType Directory -Force -Path $alone | Out-Null
          Copy-Item $env:EXE -Destination $alone
          if ((Get-ChildItem $alone -File).Count -ne 1) { throw "more than one file beside the executable" }
          $fx = Join-Path $env:RUNNER_TEMP 'fixtures'
          $out = Join-Path $env:RUNNER_TEMP 'smoke-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Nothing may resolve from the build tree.
          $native = Join-Path $env:GITHUB_WORKSPACE 'target\native'
          Rename-Item -Path (Join-Path $native 'prefix-static') -NewName 'prefix-static.moved-away'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($v in 'LIBHEIF_PLUGIN_PATH', 'AUTOCROP_NATIVE_PREFIX', 'LD_LIBRARY_PATH') { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          Set-Location $alone
          $cli = Join-Path $alone 'auto-crop.exe'

          # auto-crop.exe is a GUI-subsystem program: its output is read through a pipe (which makes
          # PowerShell wait for it, and gives the exit code).
          function Run-Cli([string]$file, [string]$tag, [string]$mode) {
            $o = Join-Path $out "$tag.jpg"
            $env:AUTOCROP_DECODE = $mode
            $text = (& $cli dev-pipeline $file --json --out $o 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Remove-Item Env:AUTOCROP_DECODE
            [pscustomobject]@{ Code = $code; Text = $text.Trim(); Out = $o }
          }

          # 0. doctor: the libraries are linked in, the executable is its own sandboxed worker.
          $doctor = (& $cli doctor 2>&1 | Out-String)
          Write-Host $doctor
          if ($doctor -notmatch '(?m)^heif: +built in; libheif .*HEVC found, AV1 found') { throw "doctor does not report libheif with HEVC and AV1" }
          if ($doctor -notmatch '(?m)^worker: .*auto-crop\.exe.*HEIC and AVIF decode there') { throw "doctor does not say the executable is its own worker" }
          if ($doctor -notmatch '(?m)^sandbox: +(\S.*) \[([a-z-]+)\]\s*$') { throw "doctor prints no sandbox level" }
          $level = $Matches[1]; $tier = $Matches[2]
          if ($tier -eq 'none') { throw "the worker reports no sandbox: $level" }
          if ($doctor -notmatch 'checked from inside the worker: file=denied') { throw "the worker did not see its file access denied" }
          if ($doctor -notmatch 'spawn=denied') { throw "the worker could start a process" }
          $ver = (& $cli --decode-worker --version | Out-String).Trim()
          Write-Host $ver
          if ($ver -notmatch 'escape-tests=off') { throw "the shipped worker has the escape-tests feature" }

          # 1. AVIF and HEIC, forced through the worker (never falls back) and in the default mode.
          foreach ($mode in 'worker', 'auto') {
            $r = Run-Cli (Join-Path $fx 'gradient-444-48x32.avif') "avif-$mode" $mode
            Write-Host "AVIF ($mode): exit $($r.Code): $($r.Text)"
            if ($r.Code -ne 0 -or $r.Text -notmatch '"source":\[48,32\]') { throw "the AVIF did not decode ($mode)" }
            if (-not (Test-Path $r.Out) -or (Get-Item $r.Out).Length -eq 0) { throw "no output file for the AVIF ($mode)" }
            $r = Run-Cli (Join-Path $fx 'rainbow-451x461.heic') "heic-$mode" $mode
            Write-Host "HEIC ($mode): exit $($r.Code): $($r.Text)"
            if ($r.Code -ne 0 -or $r.Text -notmatch '"source":\[451,461\]') { throw "the HEIC did not decode ($mode)" }
            if (-not (Test-Path $r.Out) -or (Get-Item $r.Out).Length -eq 0) { throw "no output file for the HEIC ($mode)" }
            if ($r.Text -match 'Sandbox level: none') { throw "decoded without the sandbox ($mode)" }
          }

          @(
            '### Windows single-file smoke test (auto-crop.exe copied ALONE into an empty folder)',
            '',
            "* ``auto-crop.exe`` SHA-256 ``$env:SHA256``",
            "* libheif, dav1d and libde265 are linked in; doctor reports HEVC and AV1 found",
            "* AVIF 48x32 and HEIC 451x461 decoded, forced through the sandboxed worker (the same exe, ``--decode-worker``) and in the default mode; sandbox level reported by the worker itself: ``$level`` (tier $tier)",
            '* build tree moved away, PATH reduced to System32',
            '* the desktop window was not driven by a test'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Restore the build tree
        if: always()
        shell: pwsh
        run: |
          $m = 'target\native\prefix-static.moved-away'
          if (Test-Path $m) { Rename-Item -Path $m -NewName 'prefix-static' }
      - name: The app starts from the lone exe (informational; the window is not tested)
        continue-on-error: true
        shell: pwsh
        run: |
          $alone = Join-Path $env:RUNNER_TEMP 'alone'
          $env:AUTO_CROP_HOME = Join-Path $env:RUNNER_TEMP 'gui-home'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath (Join-Path $alone 'auto-crop.exe') -WorkingDirectory $alone -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "auto-crop.exe exited with code $($p.ExitCode) within 10 seconds" }
          Write-Host "auto-crop.exe is running after 10 seconds (pid $($p.Id)); stopping it"
          Stop-Process -Id $p.Id -Force
      - name: Upload auto-crop.exe, its notices and checksum (14 days; nothing is published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-crop-windows-x64-${{ steps.pkg.outputs.ver }}
          path: |
            dist/auto-crop.exe
            dist/THIRD_PARTY_NOTICES.md
            dist/SHA256SUMS-windows-x64-${{ steps.pkg.outputs.ver }}.txt
          retention-days: 14
          if-no-files-found: error
