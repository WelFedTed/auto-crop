# Builds the pinned native libraries (decode-only libheif, libde265, libjpeg-turbo) on three OSes
# (ROADMAP M0.40, M0.41, M0.44). Nothing from this build is distributed.
name: Native libraries

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 3"
  push:
    branches: [main]
    paths:
      - "native-deps.toml"
      - "xtask/src/native.rs"
      - "xtask/src/check_native.rs"
      - "packaging/allowed-libs.txt"
      - "spikes/turbojpeg/**"
      - "spikes/heic/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}${{ matrix.best-effort && ' (best-effort)' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, best-effort: false }
          - { os: macos-latest, best-effort: false }
          - { os: ubuntu-22.04, best-effort: false }
          - { os: ubuntu-24.04, best-effort: true }
          - { os: ubuntu-22.04-arm, best-effort: true, jobs: '2' }
          - { os: windows-11-arm, best-effort: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain report
        shell: bash
        run: cargo xtask doctor || true
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
          $dir = "C:\Program Files\NASM"
          if (Test-Path $dir) { $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build pinned native libraries
        env:
          AUTOCROP_BUILD_JOBS: ${{ matrix.jobs }}
        run: cargo xtask build-native
      - name: Check the built libraries (no GPL encoders, allowed dependencies, libjpeg-turbo floor)
        run: cargo xtask check-native
      - name: Negative tests - a planted x265 symbol and an old libjpeg-turbo must make check-native fail
        shell: bash
        run: |
          lib=$(find target/native/prefix \( -name 'turbojpeg.dll' -o -name 'libturbojpeg*.so*' -o -name 'libturbojpeg*.dylib' \) | head -1)
          test -n "$lib"
          # 1) planted x265 symbol
          rm -rf target/native-neg1 && mkdir -p target/native-neg1/lib
          cp -r target/native/prefix/include target/native-neg1/include
          cp "$lib" "target/native-neg1/lib/$(basename "$lib")"
          printf 'x265_encoder_open' >> "target/native-neg1/lib/$(basename "$lib")"
          if out=$(cargo xtask check-native --prefix target/native-neg1 2>&1); then
            echo "planted x265 symbol was NOT detected"; exit 1
          fi
          echo "$out" | grep -q "x265_" || { echo "failed for the wrong reason: $out"; exit 1; }
          echo "planted x265 symbol was rejected, as required"
          # 2) libjpeg-turbo 3.1.0 (below the 3.1.4 floor)
          rm -rf target/native-neg2 && cp -r target/native/prefix target/native-neg2
          sed -i.bak 's/LIBJPEG_TURBO_VERSION_NUMBER *[0-9][0-9]*/LIBJPEG_TURBO_VERSION_NUMBER 3001000/' target/native-neg2/include/jconfig.h
          grep -q "3001000" target/native-neg2/include/jconfig.h
          if out=$(cargo xtask check-native --prefix target/native-neg2 2>&1); then
            echo "an old libjpeg-turbo was NOT rejected"; exit 1
          fi
          echo "$out" | grep -q "below the floor" || { echo "failed for the wrong reason: $out"; exit 1; }
          echo "libjpeg-turbo 3.1.0 was rejected, as required"
      - name: libjpeg-turbo spike (scaled decode, lossless rotate, MCU-aligned crop)
        shell: bash
        run: |
          export AUTOCROP_NATIVE_PREFIX="${GITHUB_WORKSPACE}/target/native/prefix"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/native/prefix/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/native/prefix/lib:${DYLD_LIBRARY_PATH:-}"
          if command -v cygpath >/dev/null 2>&1; then
            export PATH="$(cygpath -u "${GITHUB_WORKSPACE}")/target/native/prefix/bin:$PATH"
          fi
          cargo test --manifest-path spikes/turbojpeg/Cargo.toml -- --nocapture
      - name: HEIC spike (plugin present decodes a real HEVC HEIC; plugin absent fails clearly)
        shell: bash
        run: |
          prefix="${GITHUB_WORKSPACE}/target/native/prefix"
          prefix_u="$prefix"
          if command -v cygpath >/dev/null 2>&1; then prefix_u="$(cygpath -u "$prefix")"; export PATH="$prefix_u/bin:$PATH"; fi
          export AUTOCROP_NATIVE_PREFIX="$prefix"
          export LD_LIBRARY_PATH="$prefix/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$prefix/lib:${DYLD_LIBRARY_PATH:-}"
          cargo test --manifest-path spikes/heic/Cargo.toml
          cargo build --manifest-path spikes/heic/Cargo.toml
          probe="spikes/heic/target/debug/heic-probe"
          fixture=$(find target/native -name conformance_window_padding.heic | head -1)
          test -n "$fixture"
          plugdir_u="$prefix_u/lib/libheif"
          test -d "$plugdir_u" && ls "$plugdir_u"
          # 1) plugin present: decodes
          export LIBHEIF_PLUGIN_PATH="$prefix/lib/libheif"
          out=$("$probe" "$fixture"); echo "plugin present: $out"
          echo "$out" | grep -q "^OK "
          # 2) plugin absent: the HEVC decoder is missing, decoding must fail with a clear error
          mv "$plugdir_u" "$plugdir_u.off"
          trap 'mv "$plugdir_u.off" "$plugdir_u" 2>/dev/null || true' EXIT
          unset LIBHEIF_PLUGIN_PATH
          if out=$("$probe" "$fixture"); then echo "decoded without the libde265 plugin: $out"; exit 1; fi
          echo "plugin absent: $out"
          echo "$out" | grep -q "^ERR "
      - name: List installed libraries
        shell: bash
        run: |
          find target/native/prefix -maxdepth 3 \( -name "*.dll" -o -name "*.so*" -o -name "*.dylib" -o -name "*.lib" -o -name "*.a" \) | sort

  fedora:
    name: fedora (best-effort spot check)
    runs-on: ubuntu-22.04
    continue-on-error: true
    container: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:latest on 2026-10-01
    steps:
      - name: Install toolchain
        run: dnf install -y git cmake gcc gcc-c++ make nasm curl tar xz findutils rustup && rustup-init -y --profile minimal --default-toolchain none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned native libraries and check them
        shell: bash
        run: |
          . "$HOME/.cargo/env"
          cargo xtask build-native
          cargo xtask check-native
