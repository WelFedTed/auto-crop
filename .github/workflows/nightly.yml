# ARM64 on Windows and Linux and Intel Macs are best-effort until 1.0 (decision C1):
# these jobs build and test them nightly but are never required checks.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  arm64:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustc --version && cargo --version
        shell: bash
      - run: cargo build --workspace
      - run: cargo test --workspace

  intel-mac:
    name: macos-26-intel (best-effort smoke)
    runs-on: macos-26-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --workspace
      - run: cargo test --workspace
