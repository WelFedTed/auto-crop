name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull-request runs only: every push to main keeps its own result, so a red
  # commit inside a burst of pushes is never hidden by a cancelled run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install cargo tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny,cargo-nextest,cargo-about
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustc --version && cargo --version
        shell: bash
      - name: Toolchain equals the pin
        shell: bash
        run: |
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test "$(rustc --version | cut -d' ' -f2)" = "$pin"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      - name: Release-profile panic test (panic = "unwind" must hold in release)
        run: cargo nextest run -p auto-crop-engine --release
      - run: cargo xtask check-deps
      - run: cargo xtask check-profiles
      - name: ROADMAP.md lint
        shell: bash
        run: |
          if git rev-parse --verify -q HEAD^ >/dev/null; then
            cargo xtask roadmap-check --baseline HEAD^
          else
            cargo xtask roadmap-check
          fi
      - run: cargo deny check
      - run: cargo xtask deny-selftest
      - run: cargo xtask licenses --check
      - name: Third-party notices (cargo about)
        run: cargo about generate about.hbs -o THIRD_PARTY_NOTICES.md

  shell-gui:
    # The desktop shell (Tauri 2) with the `gui` feature, which no other job of this file builds
    # (the workspace jobs leave it off so they need no WebKitGTK). Windows, macOS and Linux each
    # compile, lint and test the shell crate; the packaged builds (package-*.yml) do the release
    # build with the native libraries. No `heif` feature here: that is heif.yml's job.
    name: shell with gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and GTK headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the UI (the shell embeds ui/dist)
        shell: bash
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
          test -f dist/index.html
      - run: cargo clippy -p auto-crop-shell --features gui,custom-protocol --all-targets -- -D warnings
      - run: cargo test -p auto-crop-shell --features gui,custom-protocol
      - name: The app binary is built
        shell: bash
        run: |
          cargo build -p auto-crop-shell --features gui,custom-protocol
          ls -l target/debug/AutoCrop*

  repo-checks:
    name: repo checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask check-identity
      - run: cargo xtask provenance
      - name: CI policy guards (unsafe placement, no network crates, workflow hygiene)
        run: cargo xtask ci-guards
      - name: CI policy guards self-test (every planted violation must be detected)
        run: cargo xtask ci-guards --selftest
      - name: Toolchain report (informational)
        run: cargo xtask doctor || true

  zizmor:
    name: workflow lint (zizmor)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned version; the token switches on the online audits (stale pins, impostor commits,
      # known-vulnerable actions).
      - run: pipx run zizmor==1.30.1 .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  reuse:
    name: reuse lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run "reuse[charset-normalizer]==6.2.0" lint

  dco:
    name: DCO sign-off
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA..HEAD^2"
            git rev-parse -q --verify HEAD^2 >/dev/null || range="$BASE_SHA..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$HEAD_SHA"
          else
            range="HEAD^..HEAD"
          fi
          echo "range: $range"
          cargo xtask check-dco "$range"
