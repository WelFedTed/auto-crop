# Weekly proof that a fresh devcontainer builds with no manual steps (ROADMAP M0.12).
name: Devcontainer

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the container and the workspace inside it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: cargo xtask doctor && cargo build --workspace
