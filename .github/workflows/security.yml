# Daily advisory checks. SLA (PROVISIONAL): critical/high 7 days (72 h target for critical),
# moderate/low within 30 days. A watch on native-deps.toml libraries is added with M0.39.
name: Security

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check advisories
      - run: cargo audit
