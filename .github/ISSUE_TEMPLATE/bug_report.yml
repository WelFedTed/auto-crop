name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private documents or images you cannot share. Never post vulnerabilities here: use the private security report link.
  - type: input
    id: version
    attributes:
      label: Version and install channel
      placeholder: "e.g. v0.2.0, Windows installer"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11 23H2 x64"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Paste the redacted diagnostics from "Report issue" if available.
