name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/WelFedTed/auto-crop/blob/main/ROADMAP.md) and the non-goals in [PLAN 1.3](https://github.com/WelFedTed/auto-crop/blob/main/docs/plan/01-vision-decisions.md) first (OCR, scanner capture, watch folders, mobile and photo editing are out of scope for 1.0).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
