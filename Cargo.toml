[workspace]
resolver = "3"
exclude = ["xtask/fixtures"]
members = [
    "crates/core",
    "crates/codecs",
    "crates/imgproc",
    "crates/engine",
    "crates/cli",
    "crates/shell",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WelFedTed/auto-crop"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Every profile unwinds (never "abort"): decoder glue relies on catch_unwind.
# `cargo xtask check-profiles` enforces this.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
