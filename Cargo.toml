[workspace]
resolver = "3"
exclude = ["xtask/fixtures", "fuzz"]
members = [
    "crates/core",
    "crates/codecs",
    "crates/imgproc",
    "crates/imgproc-bench",
    "crates/engine",
    "crates/eval",
    "crates/cli",
    "crates/shell",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WelFedTed/auto-crop"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: the default float parser can be one ulp off for 17-digit inputs, so a saved EditState
# could change when reloaded (found by the M1.70 `editstate_json` fuzzer). Set here so every crate that
# parses JSON gets it, whichever packages are built together.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

# Every profile unwinds (never "abort"): decoder glue relies on catch_unwind.
# `cargo xtask check-profiles` enforces this.
[profile.dev]
panic = "unwind"

# Debug builds optimise the image kernels and the decoders: the engine's integration tests render
# real images, and an unoptimised build is minutes slower for no benefit.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.auto-crop-imgproc]
opt-level = 3
[profile.dev.package.auto-crop-codecs]
opt-level = 3
[profile.dev.package.auto-crop-engine]
opt-level = 2
# The accuracy harness runs bootstrap resampling and renders synthetic images in its tests.
[profile.dev.package.auto-crop-eval]
opt-level = 3

[profile.release]
panic = "unwind"
