# Licences accepted for third-party notices; must equal the cargo-deny allow-list in deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "IJG",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = []

# rav1e lists libfuzzer-sys as a `cfg(fuzzing)` dependency: it is compiled only when someone builds
# rav1e's own fuzz targets with `--cfg fuzzing`, never in this workspace. Its licence is
# "(MIT OR Apache-2.0) AND NCSA"; NCSA is the permissive University of Illinois licence (BSD-style).
# Same exception as deny.toml; without it `cargo about` (the package workflows) fails.
[libfuzzer-sys]
accepted = ["NCSA"]
