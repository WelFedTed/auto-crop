# Dependency policy (decision B2; ROADMAP M0.18). Enforced in CI by `cargo deny check`.
# MIT OR Apache-2.0 project: no AGPL, GPL or non-commercial dependencies.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error comes in through gtk3-macros, which Tauri's Linux WebKitGTK stack needs. It is a
    # compile-time macro crate, absent from Windows and macOS builds, and Linux is a best-effort
    # target (B8, B9). Revisit when Tauri moves off GTK3 or at ROADMAP M3.68.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained build-time macro crate, Linux GTK3 stack only (Tauri)" },
    # `paste` is a proc-macro that rav1e (the AVIF encoder, feature `avif`) uses to generate code. It
    # is unmaintained but archived as feature-complete, has no runtime code and no known
    # vulnerability, and rav1e 0.8.1 is the current release. Revisit when rav1e drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro crate, used by rav1e (AVIF writer)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "IJG",
]
confidence-threshold = 0.9
# rav1e lists libfuzzer-sys as a `cfg(fuzzing)` dependency: it is compiled only when someone builds
# rav1e's own fuzz targets with `--cfg fuzzing`, never in this workspace. Its licence is
# "(MIT OR Apache-2.0) AND NCSA"; NCSA is the permissive University of Illinois licence (BSD-style).
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # AGPL / GPL / otherwise unusable (decision log B2, D2)
    { crate = "heic", reason = "AGPL" },
    { crate = "heic-decoder", reason = "AGPL" },
    { crate = "dssim-core", reason = "AGPL" },
    { crate = "jpegxl-rs", reason = "GPL-3.0" },
    { crate = "jpegxl-sys", reason = "GPL-3.0 wrapper" },
    { crate = "birdcage", reason = "GPL-3.0" },
    # x264 / x265 wrappers: GPL encoders must never be linked (B12)
    { crate = "x264", reason = "GPL" },
    { crate = "x265", reason = "GPL" },
    { crate = "x264-sys", reason = "GPL" },
    { crate = "x265-sys", reason = "GPL" },
    # OpenCV is a dev-only test oracle outside the shipping workspace, never shipped
    { crate = "opencv", reason = "dev-only oracle, never shipped" },
    # purecv (pure-Rust OpenCV port) is LGPL-2.1-or-later, and Rust links statically (B2, M1.73)
    { crate = "purecv", reason = "LGPL-2.1-or-later, statically linked by Rust" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
