version = 1
SPDX-PackageName = "auto-crop"
SPDX-PackageSupplier = "WelFedTed"
SPDX-PackageDownloadLocation = "https://github.com/WelFedTed/auto-crop"

# Documentation, configuration and generated lock files that carry no inline header.
[[annotations]]
path = [
    "**/*.md",
    "docs/**",
    ".github/**",
    ".gitattributes",
    ".gitignore",
    "Cargo.lock",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "deny.toml",
    "about.toml",
    "about.hbs",
    "rust-toolchain.toml",
    "xtask/fixtures/**/Cargo.lock",
    "spikes/**/Cargo.lock",
    "spikes/gui-tauri/**/*.json",
    "crates/shell/**/*.json",
    "crates/shell/icons/**",
    "ui/**/*.json",
    "**/.gitignore",
    "spikes/gui-tauri/icons/**",
    "crates/engine/fixtures/**",
    "crates/*/src/snapshots/*.snap",
    ".devcontainer/devcontainer.json",
    "crates/imgproc/tests/fixtures/**",
    "tools/imgproc-oracles/requirements.txt",
    "tools/imgproc-oracles/requirements.lock",
    "**/*.proptest-regressions",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Auto Crop contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
