[package]
name = "auto-crop-codecs"
description = "Image decoders and encoders"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Generators for synthetic and hostile test files (ROADMAP M1.12, M1.69). Never enabled in a shipped
# build; `xtask` turns it on for `make-hostile`. The dev-dependencies below make it available to tests.
fixtures = ["dep:tiff", "dep:fax"]
# libjpeg-turbo (>= 3.1.4, built by `cargo xtask build-native` from the pin in native-deps.toml):
# DCT-domain scaled decode, lossless transforms through tj3Transform, the baseline JPEG encoder.
# Off by default: the default build is pure Rust and needs no C toolchain (ROADMAP M1.18, ADR-0008).
turbojpeg = []
# HEIC, HEIF and AVIF decoding through libheif (>= 1.23.5) with dav1d (AV1) and the libde265 plugin
# (HEVC), built by `cargo xtask build-native` from the pins in native-deps.toml (ADR-0009). Off by
# default: the default build is pure Rust, needs no C toolchain and probes (header only) but does
# not decode HEIC and AVIF.
heif = []

[dependencies]
auto-crop-core = { path = "../core" }
auto-crop-imgproc = { path = "../imgproc" }
# Pure-Rust decoders only (zune-jpeg 0.5.15, png, tiff, image-webp). HEIC and the libjpeg-turbo path
# arrive in M6 and M1.18/M1.19 (ADR-0004/0005).
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
# Pin: zune-jpeg 0.5.15 is the release we measured (ROADMAP M1.15); the 0.5.16 release candidate is not
# adopted. `image` resolves to this exact version anyway; the pin keeps a lockfile refresh from moving it.
zune-jpeg = "=0.5.15"
# Baseline pure-Rust JPEG encoder (M1.21). `(MIT OR Apache-2.0) AND IJG`: the notices carry the IJG text.
jpeg-encoder = "0.7"
# PNG writer for the baseline encoder (8/16-bit, pHYs, iCCP); the decoder side stays behind `image`.
png = "0.18"
tiff = { version = "0.11", optional = true }
fax = { version = "0.3", optional = true }
# Bounded inflate of the PNG iCCP chunk before the PNG decoder sees it (already in the tree via `png`).
flate2 = "1"

[dev-dependencies]
rayon = "1"
tiff = "0.11"
fax = "0.3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# CI and timing helper of the `heif` feature (decode one file, print one line).
[[example]]
name = "heif_probe"
required-features = ["heif"]

# ROADMAP M1.56; `cargo bench -p auto-crop-codecs --features fixtures[,turbojpeg] --bench decode`.
[[bench]]
name = "decode"
harness = false
required-features = ["fixtures"]

# `deny`, not `forbid`: the only `unsafe` is the SAFETY-commented FFI of `src/turbo/ffi/` (feature
# `turbojpeg`) and of `src/heif/ffi/` (feature `heif`), which `#![allow(unsafe_code)]` themselves;
# `cargo xtask ci-guards` allows that nowhere else.
[lints.rust]
unsafe_code = "deny"
