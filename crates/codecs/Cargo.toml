[package]
name = "auto-crop-codecs"
description = "Image decoders and encoders"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
auto-crop-imgproc = { path = "../imgproc" }
# Pure-Rust JPEG and PNG only for now. HEIC, TIFF, WebP and the libjpeg-turbo path arrive in M6/M11
# (ADR-0004/0005); this is the stand-in that makes the first GUI testable.
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[lints.rust]
unsafe_code = "forbid"
