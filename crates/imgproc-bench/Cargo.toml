[package]
name = "auto-crop-imgproc-bench"
description = "Criterion benchmarks and cross-library comparisons for the imgproc kernels (not shipped)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
auto-crop-imgproc = { path = "../imgproc" }
rayon = "1"
fast_image_resize = { version = "6", features = ["rayon"] }
image = { version = "0.25", default-features = false }

[dev-dependencies]
image-compare = { version = "0.5", default-features = false }
serde_json.workspace = true
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "warp"
harness = false

[[bench]]
name = "threshold"
harness = false

[[bench]]
name = "resize"
harness = false
