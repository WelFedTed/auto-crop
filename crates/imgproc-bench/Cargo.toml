[package]
name = "auto-crop-imgproc-bench"
description = "Criterion benchmarks and cross-library comparisons for the imgproc kernels (not shipped)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
auto-crop-imgproc = { path = "../imgproc" }
rayon = "1"
fast_image_resize = { version = "6", features = ["rayon"] }
image = { version = "0.25", default-features = false }
# BSD-3-Clause OR Apache-2.0; measured in M1.56 (ADR-0008), gamma-space and linear-light resampling.
pic-scale = { version = "0.7", features = ["colorspaces"] }

[dev-dependencies]
auto-crop-codecs = { path = "../codecs", features = ["fixtures"] }
# M1.58 instruction-count benchmarks (compiled everywhere, run only on Linux/Valgrind). The runner
# binary must have the same version: `cargo install gungraun-runner --version 0.20.0 --locked`.
gungraun = "0.20"
image-compare = { version = "0.5", default-features = false }
serde_json.workspace = true
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "warp"
harness = false

[[bench]]
name = "threshold"
harness = false

[[bench]]
name = "resize"
harness = false

[[bench]]
name = "gungraun"
harness = false
