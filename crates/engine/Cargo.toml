[package]
name = "auto-crop-engine"
description = "Job queue, edit pipeline, safe writes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Open HEIC, HEIF and AVIF files: turns on the libheif decoder of `auto-crop-codecs` (needs the
# libraries of `cargo xtask build-native`). Off by default; sources in these formats are never
# replaced in place (no writer yet), only copied as PNG or JPEG.
heif = ["auto-crop-codecs/heif"]

[dependencies]
auto-crop-core = { path = "../core" }
auto-crop-codecs = { path = "../codecs" }
auto-crop-imgproc = { path = "../imgproc" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon = "1"
blake3 = { version = "1", features = ["pure"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
# The generated test files (WebP, TIFF) of `tests/formats.rs`; the feature is on for tests only.
auto-crop-codecs = { path = "../codecs", features = ["fixtures"] }
tempfile = "3"
peak_alloc = "0.3"
insta = { version = "1", features = ["json"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
