[package]
name = "auto-crop-shell"
description = "Thin desktop shell (the only crate allowed to depend on Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# The Tauri GUI. Off by default so the workspace-wide jobs (fmt, clippy, nextest, deny) and Linux CI
# without the WebKitGTK system libraries keep building until the M3.70 shell jobs exist.
# Build the app with: cargo build -p auto-crop-shell --release --features gui,custom-protocol
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:getrandom"]
# HEIC, HEIF and AVIF input (libheif, dav1d and the libde265 plugin next to the executable).
heif = ["auto-crop-engine/heif"]
# Serve the embedded UI (ui/dist) instead of the dev server URL.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
auto-crop-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.1", default-features = false, features = ["wry", "common-controls-v6", "compression"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
getrandom = { version = "0.3", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[[bin]]
name = "AutoCrop"
path = "src/main.rs"
required-features = ["gui"]

[lints]
workspace = true
