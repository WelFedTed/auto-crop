# Native library pins (ROADMAP M0.39). Every download is verified against its SHA-256 before use;
# a wrong hash is refused. `cargo xtask build-native` builds the `build = "cmake"` entries.
# Minimum versions are security floors (libheif >= 1.23.5, libde265 >= 1.1.3, libjpeg-turbo >= 3.1.4).
# Licences: LGPL libraries are shipped as separate, dynamically linked, replaceable libraries (B12).
# Never add x265, x264 or any GPL encoder (B12, B2).

[[lib]]
name = "libde265"
version = "1.1.3"
min_version = "1.1.3"
url = "https://github.com/strukturag/libde265/releases/download/v1.1.3/libde265-1.1.3.tar.gz"
sha256 = "554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905"
license = "LGPL-3.0-or-later"
kind = "source"
build = "cmake"
flags = ["-DBUILD_SHARED_LIBS=ON", "-DENABLE_DECODER=ON", "-DENABLE_ENCODER=OFF", "-DENABLE_SDL=OFF"]
notes = "HEVC decoder only (decision B12); shared library"

[[lib]]
name = "libheif"
version = "1.23.5"
min_version = "1.23.5"
url = "https://github.com/strukturag/libheif/releases/download/v1.23.5/libheif-1.23.5.tar.gz"
sha256 = "fd9036064c4432f0550d15072ddf34956a248279ee9aeaff0fba3fa0f77d8f1a"
license = "LGPL-3.0-or-later"
kind = "source"
build = "cmake"
flags = [
    "-DBUILD_SHARED_LIBS=ON",
    "-DBUILD_TESTING=OFF",
    "-DBUILD_DOCUMENTATION=OFF",
    "-DWITH_EXAMPLES=OFF",
    "-DWITH_EXAMPLE_HEIF_THUMB=OFF",
    "-DWITH_EXAMPLE_HEIF_VIEW=OFF",
    "-DWITH_GDK_PIXBUF=OFF",
    "-DWITH_LIBSHARPYUV=OFF",
    "-DWITH_LIBDE265=ON",
    "-DWITH_LIBDE265_PLUGIN=ON",
    "-DWITH_X265=OFF",
    "-DWITH_X264=OFF",
    "-DWITH_KVAZAAR=OFF",
    "-DWITH_UVG266=OFF",
    "-DWITH_VVENC=OFF",
    "-DWITH_VVDEC=OFF",
    "-DWITH_OpenH264_DECODER=OFF",
    "-DWITH_AOM_DECODER=OFF",
    "-DWITH_AOM_ENCODER=OFF",
    "-DWITH_DAV1D=OFF",
    "-DWITH_SvtEnc=OFF",
    "-DWITH_RAV1E=OFF",
    "-DWITH_JPEG_DECODER=OFF",
    "-DWITH_JPEG_ENCODER=OFF",
    "-DWITH_OpenJPEG_DECODER=OFF",
    "-DWITH_OpenJPEG_ENCODER=OFF",
    "-DWITH_OPENJPH_ENCODER=OFF",
    "-DWITH_FFMPEG_DECODER=OFF",
]
notes = "decode-only build; never embedded-libheif or vcpkg hevc"

[[lib]]
name = "libjpeg-turbo"
version = "3.2.0"
min_version = "3.1.4"
url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz"
sha256 = "6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e"
license = "IJG AND BSD-3-Clause AND Zlib"
kind = "source"
build = "cmake"
flags = ["-DENABLE_SHARED=ON", "-DENABLE_STATIC=OFF", "-DWITH_JAVA=OFF", "-DWITH_TURBOJPEG=ON", "-DREQUIRE_SIMD=ON", "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"]
notes = "needs NASM on x86; the turbojpeg crate vendors an older version, so we link our own"

