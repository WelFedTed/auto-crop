# Throwaway spike (ROADMAP M0.32-M0.35): ort vs rten vs tract on stand-in nets.
# Never part of the shipping workspace or default CI.
[workspace]

[package]
name = "spike-inference"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "infer"
path = "src/main.rs"

[features]
default = ["ort-b", "rten-b", "tract-b"]
ort-b = ["dep:ort"]
rten-b = ["dep:rten", "dep:rten-tensor"]
tract-b = ["dep:tract-onnx", "dep:tract-linalg"]

[dependencies]
ort = { version = "=2.0.0-rc.13", optional = true }
rten = { version = "=0.26.0", optional = true }
rten-tensor = { version = "=0.26.0", optional = true }
tract-onnx = { version = "=0.23.8", optional = true }
tract-linalg = { version = "=0.23.8", optional = true, features = ["multithread-mm"] }

[profile.release]
panic = "unwind"
