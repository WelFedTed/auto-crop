# Throwaway spike (ROADMAP M1.65): flatten uneven illumination with a per-block high-percentile
# luma map. Never part of the shipping workspace or default CI.
[workspace]

[package]
name = "spike-enhance"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Only for the synthetic page texture (`synth::paper_texture`) and the area-average proxy.
auto-crop-imgproc = { path = "../../crates/imgproc" }

[profile.release]
panic = "unwind"
debug = false
