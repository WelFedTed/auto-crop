[package]
name = "xtask"
description = "Repository automation: roadmap-check, check-deps, check-profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
toml = "0.9"
goblin = "0.10"
auto-crop-codecs = { path = "../crates/codecs", features = ["fixtures"] }
# Manifest types and checks of the accuracy harness, so corpus adapters write exactly its format.
auto-crop-eval = { path = "../crates/eval" }
# Reads gzipped ground-truth tables (SmartDoc metadata.csv.gz); pure Rust backend, no network.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
auto-crop-core = { path = "../crates/core" }
auto-crop-engine = { path = "../crates/engine" }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
# Entry points of the cargo-fuzz targets, replayed on every OS (M1.71); without libFuzzer.
auto-crop-fuzz = { path = "../fuzz", default-features = false }

[lints]
workspace = true
