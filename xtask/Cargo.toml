[package]
name = "xtask"
description = "Repository automation: roadmap-check, check-deps, check-profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Run the hostile-file corpus and the fuzz-seed replay through libheif and dav1d too:
# `cargo run -p xtask --features heif -- make-hostile --only avif` (needs `cargo xtask build-native`).
heif = ["auto-crop-codecs/heif"]
# The analysis stand-ins of M1.55, for `perf standin` and `perf stages --analyse`:
# `cargo run --release -p xtask --features standin-ort,standin-rten,standin-canny -- perf standin`.
standin-ort = ["auto-crop-engine/standin-ort"]
standin-rten = ["auto-crop-engine/standin-rten"]
standin-canny = ["auto-crop-engine/standin-canny"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
toml = "0.9"
goblin = "0.10"
auto-crop-codecs = { path = "../crates/codecs", features = ["fixtures"] }
# Manifest types and checks of the accuracy harness, so corpus adapters write exactly its format.
auto-crop-eval = { path = "../crates/eval" }
# Reads gzipped ground-truth tables (SmartDoc metadata.csv.gz); pure Rust backend, no network.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
auto-crop-core = { path = "../crates/core" }
auto-crop-engine = { path = "../crates/engine" }
# The labeller (`cargo xtask label`) previews images and, only on request, runs the detector.
auto-crop-imgproc = { path = "../crates/imgproc" }
# Per-run random token of the labeller's local server. `getrandom` is the OS entropy source (no
# network, no I/O beyond the OS call); it is already in the lock through the std ecosystem.
getrandom = "0.4"
auto-crop-infer = { path = "../crates/infer" }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
# Entry points of the cargo-fuzz targets, replayed on every OS (M1.71); without libFuzzer.
auto-crop-fuzz = { path = "../fuzz", default-features = false }

[lints]
workspace = true
